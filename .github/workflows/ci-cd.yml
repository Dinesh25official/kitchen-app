name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "student/**" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd api
          npm ci

      - name: Run tests
        run: |
          cd api
          npm test || echo "Test failed but continuing"

      - name: Run lint (optional)
        run: |
          cd api
          npm run lint || true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t kitchen-api:ci ./api --target production

      - name: Build Web UI image
        run: docker build -t kitchen-web:ci ./web-ui

  k8s-smoke:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes YAML
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/db/statefulset.yaml
          kubectl apply --dry-run=client -f k8s/api/deployment.yaml
          kubectl apply --dry-run=client -f k8s/web-ui/deployment.yaml